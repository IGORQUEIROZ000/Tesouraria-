<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesouraria — Gerados em Bétel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141210;
  --bg-soft:#1B1815;
  --surface:#211D19;
  --surface-2:#2A2521;
  --line:#3A332C;
  --cream:#E7DEC8;
  --cream-dim:#B8AE96;
  --orange:#DA4E19;
  --orange-bright:#F0682E;
  --olive:#4B5240;
  --olive-bright:#7C8A66;
  --red:#C9483A;
  --shadow: 0 12px 30px rgba(0,0,0,0.45);
  --radius: 14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(218,78,25,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(75,82,64,0.12), transparent 60%),
    var(--bg);
  color:var(--cream);
  font-family:'Work Sans', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--orange); color:#141210; }
h1,h2,h3,.display{
  font-family:'Anton', sans-serif;
  font-weight:400;
  letter-spacing:0.02em;
  text-transform:uppercase;
  color:var(--cream);
}
.script{ font-family:'Caveat', cursive; font-weight:600; }
.mono{ font-family:'JetBrains Mono', monospace; }

a{color:inherit;}
button{ font-family:inherit; cursor:pointer; }

/* ---------- App shell ---------- */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:230px; flex-shrink:0;
  background:var(--bg-soft);
  border-right:1px solid var(--line);
  padding:20px 14px;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{ display:flex; align-items:center; gap:10px; padding:6px 6px 18px; border-bottom:1px solid var(--line); margin-bottom:14px;}
.brand img{ width:38px; height:auto; border-radius:8px; }
.brand-text{ line-height:1.05; }
.brand-text .t1{ font-family:'Anton'; font-size:14px; letter-spacing:0.03em; }
.brand-text .t2{ font-family:'Caveat'; font-size:16px; color:var(--orange-bright); margin-top:-2px;}

nav{ display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px;
  color:var(--cream-dim); text-decoration:none;
  font-size:13.5px; font-weight:500;
  border:1px solid transparent;
  background:transparent;
  transition:.15s;
}
.nav-item .ic{ font-size:15px; width:18px; text-align:center; }
.nav-item:hover{ background:var(--surface); color:var(--cream); }
.nav-item.active{ background:linear-gradient(135deg, rgba(218,78,25,0.18), rgba(218,78,25,0.05)); color:var(--orange-bright); border-color:rgba(218,78,25,0.3); }

.sidebar-footer{ border-top:1px solid var(--line); padding-top:12px; margin-top:8px; }
.status-pill{ display:flex; align-items:center; gap:8px; font-size:11.5px; padding:8px 10px; border-radius:9px; background:var(--surface); color:var(--cream-dim); }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.green{ background:#7CBB6B; box-shadow:0 0 8px #7CBB6B88;}
.dot.yellow{ background:#E0B33A; box-shadow:0 0 8px #E0B33A88;}
.dot.red{ background:var(--red); box-shadow:0 0 8px #C9483A88;}

main{ flex:1; padding:26px 34px 60px; max-width:1280px; }
.page{ display:none; animation:fade .25s ease; }
.page.active{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

.page-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
.page-header h1{ font-size:26px; margin:0; }
.page-header .sub{ color:var(--cream-dim); font-size:13px; margin-top:4px; font-family:'Work Sans'; text-transform:none; letter-spacing:0; }

.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--cream);
  padding:9px 16px; border-radius:10px; font-size:13.5px; font-weight:600;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:linear-gradient(135deg, var(--orange-bright), var(--orange)); border-color:transparent; color:#1a1310; box-shadow:0 6px 16px rgba(218,78,25,0.35); }
.btn-primary:hover{ filter:brightness(1.08); }
.btn-danger{ background:transparent; border-color:var(--red); color:#E58077; }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--cream-dim); }
.btn-ghost:hover{ color:var(--cream); background:var(--surface); }
.btn-sm{ padding:6px 11px; font-size:12px; border-radius:8px; }

/* cards / grid */
.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:repeat(2,1fr); }
@media(max-width:1000px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 18px;
}
.card.tight{ padding:14px 16px; }
.kpi-label{ font-size:11.5px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
.kpi-value{ font-family:'Anton'; font-size:26px; margin-top:6px; }
.kpi-value.pos{ color:#8FCB7C; }
.kpi-value.neg{ color:#E27469; }
.kpi-sub{ font-size:11.5px; color:var(--cream-dim); margin-top:4px; }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{ text-align:left; color:var(--cream-dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; padding:8px 10px; border-bottom:1px solid var(--line); }
td{ padding:10px 10px; border-bottom:1px solid rgba(255,255,255,0.04); }
tr:hover td{ background:rgba(255,255,255,0.02); }
.tag{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
.tag.entrada{ background:rgba(124,138,102,0.18); color:#9CC77E; }
.tag.saida{ background:rgba(201,72,58,0.18); color:#E58077; }
.tag.saldo_inicial{ background:rgba(218,78,25,0.16); color:var(--orange-bright); }
.tag.transferencia{ background:rgba(184,174,150,0.16); color:var(--cream-dim); }
.tag.status{ background:var(--surface-2); color:var(--cream-dim); }

.toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
input, select, textarea{
  background:var(--bg-soft); border:1px solid var(--line); color:var(--cream);
  padding:9px 11px; border-radius:9px; font-size:13.5px; font-family:inherit;
}
input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--orange); }
label{ font-size:11.5px; color:var(--cream-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-bottom:5px; }
.field{ margin-bottom:14px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* modal */
.overlay{ position:fixed; inset:0; background:rgba(10,8,7,0.72); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;}
.overlay.open{ display:flex; }
.modal{ background:var(--bg-soft); border:1px solid var(--line); border-radius:16px; width:100%; max-width:560px; padding:26px 26px 22px; box-shadow:var(--shadow); }
.modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.modal-header h2{ font-size:19px; margin:0; }
.close-x{ background:none; border:none; color:var(--cream-dim); font-size:20px; }

.empty{ text-align:center; padding:40px 20px; color:var(--cream-dim); }
.empty .ic{ font-size:32px; margin-bottom:10px; }

.alert-banner{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:12px; margin-bottom:18px; border:1px solid; font-size:13px; }
.alert-banner.warn{ background:rgba(224,179,58,0.08); border-color:rgba(224,179,58,0.35); color:#E0B33A; }
.alert-banner.crit{ background:rgba(201,72,58,0.08); border-color:rgba(201,72,58,0.35); color:#E58077; }
.alert-banner.ok{ background:rgba(124,187,107,0.08); border-color:rgba(124,187,107,0.3); color:#8FCB7C; }
.alert-banner b{ font-weight:700; }
.alert-banner .grow{ flex:1; }

.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ padding:6px 12px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); font-size:12.5px; color:var(--cream-dim); cursor:pointer; }
.chip.on{ background:var(--orange); color:#1a1310; border-color:transparent; font-weight:700; }

.section-title{ font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--cream-dim); font-weight:700; margin:26px 0 10px; }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:10px; }
::-webkit-scrollbar-track{ background:transparent; }

.list-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid rgba(255,255,255,0.05); }
.list-row:last-child{ border-bottom:none; }

@media(max-width:820px){
  #app{ flex-direction:column; }
  .sidebar{ position:static; width:100%; height:auto; flex-direction:row; align-items:center; overflow-x:auto; padding:12px; }
  .brand{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  nav{ flex-direction:row; }
  .sidebar-footer{ display:none; }
  main{ padding:16px; }
  .field-row{ grid-template-columns:1fr; }
}

.print-only{ display:none; }
@media print{
  .sidebar, .no-print, .page-header .btn, .overlay { display:none !important; }
  body{ background:#fff !important; color:#111 !important; }
  main{ padding:0; max-width:100%; }
  .card{ background:#fff !important; border:1px solid #ccc !important; box-shadow:none !important; }
  .kpi-value, h1,h2,h3,.display{ color:#111 !important; }
  .kpi-sub, .sub, .kpi-label, .cream-dim, td, th{ color:#333 !important; }
  th{ border-color:#ccc !important; }
  td{ border-color:#e2e2e2 !important; }
  .tag{ border:1px solid #999; background:#fff !important; color:#111 !important; }
  .print-only{ display:block; }
  .page-header{ display:block; }
}
</style>
</head>

<script>
/* =========================================================================
   TESOURARIA — GERADOS EM BÉTEL
   Sistema completo (telas 1–12 do prompt mestre) + rodada de correções de
   integridade financeira: bloqueio real de mês fechado, recálculo em
   cascata, saldo inicial único por conta, edição segura de lançamentos,
   comprovantes/anexos, proteção de contas com saldo, e validação robusta
   de backup/restauração.
   Regra central: uma movimentação = um único registro na base financeira.
   ========================================================================= */

const STORAGE_KEY = 'betel_tesouraria_db_v1';
const APP_VERSION = '0.4.1';
const APP_STATUS = 'Desenvolvimento — uso local, um único usuário';

const CATEGORIAS_INICIAIS = ['Lava-jato','Doações','Cantina','Patrocínio','Ofertas','Arrecadações','Eventos','Materiais','Outros'];
const CONTAS_INICIAIS = [
  { name:'Caixa físico', type:'Caixa' },
  { name:'Conta bancária', type:'Banco' },
  { name:'PIX', type:'PIX' },
];

function uid(prefix){
  return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}
function nowISO(){ return new Date().toISOString(); }
function todayInputValue(){ const d=new Date(); return d.toISOString().slice(0,10); }

function brl(v){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : null; } // YYYY-MM
function yearOf(dateStr){ return dateStr ? Number(dateStr.slice(0,4)) : null; }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* ---------------------------- Camada de dados --------------------------- */

function defaultDB(){
  const db = {
    meta: {
      version: APP_VERSION,
      createdAt: nowISO(),

    .forEach(([id,name]) => db.actionEventStatuses.push({ id, name, status:'ativo', builtin:true, createdAt: nowISO() }));

    .forEach(([id,name]) => db.eventTypes.push({ id, name, status:'ativo', builtin:true, createdAt: nowISO() }));

let DB = loadDB();

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    // garante presença de todas as chaves mesmo vindo de versões antigas
    const base = defaultDB();
    return Object.assign({}, base, parsed, {
      meta: Object.assign({}, base.meta, parsed.meta),
      settings: Object.assign({}, base.settings, parsed.settings),
    });
  }catch(e){
    console.error('Falha ao carregar base local, iniciando nova base.', e);
    return defaultDB();
  }
}

function saveDB({ touchData = true } = {}){
  if(touchData) DB.meta.lastDataChangeAt = nowISO();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){
    console.error('Falha ao salvar localmente', e);
    alert('Não foi possível salvar os dados neste dispositivo — o armazenamento local pode estar cheio (comprovantes ocupam bastante espaço). Faça um backup manual agora (Configurações → Exportar Backup) e considere anexar comprovantes menores ou remover anexos antigos.');
  }
}

function audit(action, entity, entityId, before, after, changes){
  DB.auditLog.unshift({
    id: uid('log'), timestamp: nowISO(), user: 'Tesoureiro',
    action, entity, entityId,
    before: before ? JSON.parse(JSON.stringify(before)) : null,
    after: after ? JSON.parse(JSON.stringify(after)) : null,
    changes: changes || null,
  });
  if(DB.auditLog.length > 2000) DB.auditLog.length = 2000;
}
function diffCamposLancamento(before, after){
  const campos = { date:'Data', type:'Tipo', categoryId:'Categoria', actionId:'Ação', eventId:'Evento', accountId:'Conta', transferToAccountId:'Conta destino', paymentMethod:'Forma de pagamento', value:'Valor', responsible:'Responsável', description:'Descrição', note:'Observação' };
  const changes = [];
  Object.keys(campos).forEach(k=>{
    let bVal = before[k], aVal = after[k];
    if(k==='categoryId') { bVal = categoryById(bVal)?.name || bVal; aVal = categoryById(aVal)?.name || aVal; }
    if(k==='actionId') { bVal = actionById(bVal)?.name || bVal; aVal = actionById(aVal)?.name || aVal; }
    if(k==='eventId') { bVal = eventById(bVal)?.name || bVal; aVal = eventById(aVal)?.name || aVal; }
    if(k==='accountId' || k==='transferToAccountId') { bVal = accountById(bVal)?.name || bVal; aVal = accountById(aVal)?.name || aVal; }
    if(k==='value') { bVal = brl(before[k]); aVal = brl(after[k]); }
    if(k==='date') { bVal = fmtDate(before[k]); aVal = fmtDate(after[k]); }
    if(String(bVal||'') !== String(aVal||'')){
      changes.push({ campo: campos[k], de: bVal||'—', para: aVal||'—' });
    }
  });
  return changes;
}

/* ------------------------------ Consultas -------------------------------- */

function activeTx(){ return DB.transactions.filter(t => t.status !== 'cancelado'); }

// Função central: soma entradas e saídas de uma lista de lançamentos.
// Não considera saldo_inicial (não é entrada) nem transferencia (não é receita/despesa).
// Cancelados já devem estar fora da lista recebida (ver activeTx()).
function sumEntradasSaidas(list){
  let entradas=0, saidas=0;
  list.forEach(t=>{
    if(t.type==='entrada') entradas += Number(t.value);
    else if(t.type==='saida') saidas += Number(t.value);
  });
  return { entradas, saidas };
}

function accountById(id){ return DB.accounts.find(a=>a.id===id); }
function categoryById(id){ return DB.categories.find(c=>c.id===id); }
// categorias de backups antigos (versões < 0.4.0) não têm "type" — tratamos como 'ambos' (não restringe nada)
function categoryType(cat){ return cat?.type || 'ambos'; }
function actionById(id){ return DB.actions.find(a=>a.id===id); }
function eventById(id){ return DB.events.find(e=>e.id===id); }

function accountBalance(accountId){
  let saldo = 0;
  activeTx().forEach(t=>{
    if(t.type === 'transferencia'){
      if(t.accountId === accountId) saldo -= Number(t.value);
      if(t.transferToAccountId === accountId) saldo += Number(t.value);
      return;
    }
    if(t.accountId !== accountId) return;
    if(t.type === 'saldo_inicial') saldo += Number(t.value);
    else if(t.type === 'entrada') saldo += Number(t.value);
    else if(t.type === 'saida') saldo -= Number(t.value);
  });
  return saldo;
}

function totalPatrimonio(){
  return DB.accounts.filter(a=>a.status==='ativa').reduce((s,a)=>s+accountBalance(a.id),0);
}

function periodTotals({ month=null, year=null } = {}){
  const list = activeTx().filter(t=>{
    if(month && monthKey(t.date)!==month) return false;
    if(year && yearOf(t.date)!==year) return false;
    return true;
  });
  const { entradas, saidas } = sumEntradasSaidas(list);
  const saldoInicial = list.filter(t=>t.type==='saldo_inicial').reduce((s,t)=>s+Number(t.value),0);
  return { entradas, saidas, saldoInicial, resultado: entradas - saidas };
}

function actionSummary(actionId){
  const list = activeTx().filter(t=>t.actionId===actionId);
  const { entradas, saidas } = sumEntradasSaidas(list);
  const resultado = entradas - saidas;
  const margem = entradas>0 ? (resultado/entradas*100) : null;
  return { entradas, saidas, resultado, margem, count: list.length };
}

/* --------------------------- Meses, saldo e fechamento --------------------- */

function firstDayOfMonth(yearMonth){ return yearMonth + '-01'; }
function addMonths(yearMonth, delta){
  const [y,m] = yearMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
// saldo total (todas as contas) considerando lançamentos ativos até uma data (inclusive)
function balanceUpTo(dateStr){
  let saldo = 0;
  activeTx().forEach(t=>{
    if(t.date > dateStr) return;
    if(t.type==='transferencia') return; // não altera patrimônio total
    if(t.type==='entrada') saldo += Number(t.value);
    else if(t.type==='saida') saldo -= Number(t.value);
    else if(t.type==='saldo_inicial') saldo += Number(t.value);
  });
  return saldo;
}
function closureFor(yearMonth){ return DB.closures.find(c=>c.yearMonth===yearMonth); }
function isMonthClosed(dateStr){ return !!closureFor(monthKey(dateStr)); }
function monthsWithData(){
  const set = new Set(DB.transactions.map(t=>monthKey(t.date)));
  DB.closures.forEach(c=>set.add(c.yearMonth));
  if(set.size===0) set.add(new Date().toISOString().slice(0,7));
  const sorted = [...set].sort();
  // preenche meses intermediários sem movimentação (ex: agosto e novembro têm dados, outubro não)
  // para que o mês vazio também apareça na sequência e possa ser visualizado/gerenciado no Fechamento.
  // Não cria saldo nem lançamento algum — apenas garante que o mês entre no calendário de meses.
  const filled = [];
  let cursor = sorted[0];
  const last = sorted[sorted.length-1];
  while(cursor <= last){
    filled.push(cursor);
    cursor = addMonths(cursor, 1);
  }
  return filled;
}
function monthClosureData(yearMonth){
  const dayBefore = new Date(firstDayOfMonth(yearMonth));
  dayBefore.setDate(dayBefore.getDate()-1);
  const saldoAnteriorStr = dayBefore.toISOString().slice(0,10);
  const prevClosure = closureFor(addMonths(yearMonth,-1));
  const saldoAnterior = prevClosure ? prevClosure.saldoCalculado : balanceUpTo(saldoAnteriorStr);
  const totals = periodTotals({ month: yearMonth });
  const saldoCalculado = saldoAnterior + totals.saldoInicial + totals.entradas - totals.saidas;
  return { yearMonth, saldoAnterior, ...totals, saldoCalculado };
}

// Função central de recálculo — chamada sempre que um mês fechado for
// reaberto, alterado e fechado novamente. Propaga o novo saldo para todos
// os meses fechados posteriores, sem duplicar a lógica em cada tela.
function recalcularMesesPosteriores(fromYearMonth){
  const months = monthsWithData().filter(mk=>mk>fromYearMonth).sort();
  months.forEach(mk=>{
    const closure = closureFor(mk);
    if(!closure) return; // meses ainda abertos recalculam dinamicamente, nada a persistir
    const data = monthClosureData(mk);
    const before = {...closure};
    closure.saldoAnterior = data.saldoAnterior;
    closure.entradas = data.entradas;
    closure.saidas = data.saidas;
    closure.saldoCalculado = data.saldoCalculado;
    closure.diferenca = Math.round((closure.saldoConferido - closure.saldoCalculado)*100)/100;
    audit('recalculo','mes', mk, before, closure);
  });
}

function backupStatus(){
  const { lastBackupAt, lastDataChangeAt } = DB.meta;
  const days = DB.settings.backupAlertDays || 7;
  if(!lastBackupAt){
    return { level:'crit', label:'Backup pendente', detail:'Nenhum backup foi realizado ainda.' };
  }
  const changedSince = new Date(lastDataChangeAt) > new Date(lastBackupAt);
  const ageDays = (Date.now() - new Date(lastBackupAt).getTime()) / 86400000;
  if(changedSince){
    return { level:'warn', label:'Backup pendente', detail:`Os dados foram atualizados após o último backup (${fmtDateTime(lastDataChangeAt)}).` };
  }
  if(ageDays > days){
    return { level:'warn', label:'Backup recomendado', detail:`Último backup há ${Math.floor(ageDays)} dias — considere gerar um novo.` };
  }
  return { level:'ok', label:'Backup atualizado', detail:`Último backup: ${fmtDateTime(lastBackupAt)}.` };
}

  });

  let cells = '';

let prestacaoFilter = { type:'mes', month: new Date().toISOString().slice(0,7), year: new Date().getFullYear(), startDate: todayInputValue(), endDate: todayInputValue(), categoryId:'', actionId:'', eventId:'' };

function prestacaoTxInScope(f){
  let list = activeTx();
  if(f.type==='mes') list = list.filter(t=>monthKey(t.date)===f.month);
  else if(f.type==='ano') list = list.filter(t=>yearOf(t.date)===Number(f.year));
  else if(f.type==='periodo') list = list.filter(t=>t.date>=f.startDate && t.date<=f.endDate);
  else if(f.type==='categoria') list = list.filter(t=>t.categoryId===f.categoryId);
  else if(f.type==='acao') list = list.filter(t=>t.actionId===f.actionId);
  else if(f.type==='evento') list = list.filter(t=>t.eventId===f.eventId);
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}

function renderPrestacao(){
  const f = prestacaoFilter;
  const list = prestacaoTxInScope(f);
  const isCaixaScope = (f.type==='mes'||f.type==='ano'||f.type==='periodo');

  const totalsPrestacao = sumEntradasSaidas(list);
  const entradas = totalsPrestacao.entradas, saidas = totalsPrestacao.saidas;
  const saldoInicial = list.filter(t=>t.type==='saldo_inicial').reduce((s,t)=>s+Number(t.value),0);
  const resultado = entradas - saidas;

  let saldoAnterior = null, saldoFinal = null;
  if(isCaixaScope){
    let refDateBefore;
    if(f.type==='mes'){ const d=new Date(firstDayOfMonth(f.month)); d.setDate(d.getDate()-1); refDateBefore = d.toISOString().slice(0,10); }
    else if(f.type==='ano'){ refDateBefore = `${f.year-1}-12-31`; }
    else { const d=new Date(f.startDate); d.setDate(d.getDate()-1); refDateBefore = d.toISOString().slice(0,10); }
    saldoAnterior = balanceUpTo(refDateBefore);
    saldoFinal = saldoAnterior + saldoInicial + entradas - saidas;
  }

  // detalhamento por categoria
  const catGroups = {};
  list.forEach(t=>{
    if(t.type!=='entrada' && t.type!=='saida') return;
    const key = t.categoryId || '_sem_categoria';
    (catGroups[key] = catGroups[key] || []).push(t);
  });
  const catTotals = {};
  Object.keys(catGroups).forEach(key=>{ catTotals[key] = sumEntradasSaidas(catGroups[key]); });
  const catRows = Object.entries(catTotals).map(([catId, v])=>({
    name: catId==='_sem_categoria' ? 'Sem categoria' : (categoryById(catId)?.name || 'Categoria removida'),
    ...v,
  })).sort((a,b)=> (b.entradas+b.saidas)-(a.entradas+a.saidas));

  const scopeLabel = (()=>{
    if(f.type==='mes') return new Date(f.month+'-02').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    if(f.type==='ano') return `Ano de ${f.year}`;
    if(f.type==='periodo') return `${fmtDate(f.startDate)} a ${fmtDate(f.endDate)}`;
    if(f.type==='categoria') return `Categoria: ${categoryById(f.categoryId)?.name || 'selecione uma categoria'}`;
    if(f.type==='acao') return `Ação: ${actionById(f.actionId)?.name || 'selecione uma ação'}`;

/* ------------------------------ Página: Relatórios e Ranking --------------- */

let rankingAcaoOrdem = 'entradas';
let comparAnos = [];
let rankingAno = 'todos';
let compareAcaoA = '';
let compareAcaoB = '';

function allYearsWithData(){
  const set = new Set(activeTx().map(t=>yearOf(t.date)));
  if(set.size===0) set.add(new Date().getFullYear());
  return [...set].sort((a,b)=>a-b);
}
function allMonthsWithData(){
  const set = new Set(activeTx().map(t=>monthKey(t.date)));
  return [...set].sort();
}

function renderRelatorios(){
  const months = allMonthsWithData();
  const years = allYearsWithData();
  if(comparAnos.length===0) comparAnos = years.slice(-2);

  // escopo do ranking: todos os anos, ou um ano específico selecionado — não altera as funções centrais
  const rankScopeTx = (baseList) => rankingAno==='todos' ? baseList : baseList.filter(t=>yearOf(t.date)===Number(rankingAno));

  const catRank = DB.categories.map(c=>{
    const { entradas, saidas } = sumEntradasSaidas(rankScopeTx(activeTx().filter(t=>t.categoryId===c.id)));
    return { name:c.name, entradas, saidas };
  }).filter(r=>r.entradas>0||r.saidas>0).sort((a,b)=>b.entradas-a.entradas);

  const acaoRows = DB.actions.map(a=>{
    const list = rankScopeTx(activeTx().filter(t=>t.actionId===a.id));
    const { entradas, saidas } = sumEntradasSaidas(list);
    const resultado = entradas - saidas;
    const margem = entradas>0 ? (resultado/entradas*100) : null;
    return { name:a.name, categoria: categoryById(a.categoryId)?.name||'—', entradas, saidas, resultado, margem, count: list.length };
  });
  const acaoOrdenado = [...acaoRows].sort((a,b)=>{
    if(rankingAcaoOrdem==='entradas') return b.entradas-a.entradas;
    if(rankingAcaoOrdem==='resultado') return b.resultado-a.resultado;
    if(rankingAcaoOrdem==='margem') return (b.margem??-Infinity)-(a.margem??-Infinity);
    return 0;
  });

  const eventoRank = DB.events.map(ev=>{
    const list = rankScopeTx(activeTx().filter(t=>t.eventId===ev.id));
    const { entradas, saidas } = sumEntradasSaidas(list);
    return { name: ev.name, entradas, saidas, resultado: entradas-saidas, count: list.length };
  }).sort((a,b)=>b.resultado-a.resultado);

  return `
    <div class="page-header">
      <div><h1>Relatórios e Ranking</h1><div class="sub">Evolução histórica e comparações — nada aqui é lançado de novo, tudo vem da base de movimentações.</div></div>
      <div class="field" style="margin:0"><label>Ranking do período</label>
        <select id="rankAno">
          <option value="todos" ${rankingAno==='todos'?'selected':''}>Todos os anos</option>
          ${years.map(y=>`<option value="${y}" ${String(rankingAno)===String(y)?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="section-title">Evolução mensal</div>
    <div class="card tight" style="margin-bottom:16px">
      ${months.length===0 ? emptyState('Sem dados suficientes','') : `
      <table>
        <thead><tr><th>Mês</th><th style="text-align:right">Entradas</th><th style="text-align:right">Saídas</th><th style="text-align:right">Resultado</th></tr></thead>
        <tbody>
          ${months.slice().reverse().map(mk=>{ const t=periodTotals({month:mk}); const lbl=new Date(mk+'-02').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return `
          <tr><td style="text-transform:capitalize">${lbl}</td><td style="text-align:right" class="mono">${brl(t.entradas)}</td><td style="text-align:right" class="mono">${brl(t.saidas)}</td><td style="text-align:right" class="mono">${brl(t.resultado)}</td></tr>`; }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="section-title">Comparação entre anos</div>
    <div class="chip-row" style="margin-bottom:10px">
      ${years.map(y=>`<span class="chip ${comparAnos.includes(y)?'on':''}" data-year-chip="${y}">${y}</span>`).join('')}
    </div>
    <div class="card tight" style="margin-bottom:16px">
      ${comparAnos.length===0 ? emptyState('Selecione ao menos um ano','') : `
      <table>
        <thead><tr><th>Ano</th><th style="text-align:right">Entradas</th><th style="text-align:right">Saídas</th><th style="text-align:right">Resultado</th></tr></thead>
        <tbody>
          ${comparAnos.slice().sort((a,b)=>a-b).map(y=>{ const t=periodTotals({year:y}); return `
          <tr><td>${y}</td><td style="text-align:right" class="mono">${brl(t.entradas)}</td><td style="text-align:right" class="mono">${brl(t.saidas)}</td><td style="text-align:right" class="mono">${brl(t.resultado)}</td></tr>`; }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="section-title">Ranking de categorias (por arrecadação)</div>
    <div class="card tight" style="margin-bottom:16px">
      ${catRank.length===0 ? emptyState('Sem dados suficientes','') : `
      <table>
        <thead><tr><th>#</th><th>Categoria</th><th style="text-align:right">Entradas</th><th style="text-align:right">Saídas</th></tr></thead>
        <tbody>${catRank.map((r,i)=>`<tr><td>${i+1}º</td><td>${r.name}</td><td style="text-align:right" class="mono">${brl(r.entradas)}</td><td style="text-align:right" class="mono">${brl(r.saidas)}</td></tr>`).join('')}</tbody>
      </table>`}
    </div>

    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>Ranking de ações</span>
      <select id="rankAcaoOrdem" style="text-transform:none">
        <option value="entradas" ${rankingAcaoOrdem==='entradas'?'selected':''}>Maior arrecadação</option>
        <option value="resultado" ${rankingAcaoOrdem==='resultado'?'selected':''}>Maior resultado líquido</option>
        <option value="margem" ${rankingAcaoOrdem==='margem'?'selected':''}>Maior margem</option>
      </select>
    </div>
    <div class="card tight" style="margin-bottom:16px">
      ${acaoOrdenado.length===0 ? emptyState('Nenhuma ação cadastrada','') : `
      <table>
        <thead><tr><th>#</th><th>Ação</th><th>Categoria</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Entradas</th><th style="text-align:right">Resultado</th><th style="text-align:right">Margem</th></tr></thead>
        <tbody>${acaoOrdenado.map((r,i)=>`<tr><td>${i+1}º</td><td>${r.name}</td><td>${r.categoria}</td><td style="text-align:right" class="mono">${r.count}</td><td style="text-align:right" class="mono">${brl(r.entradas)}</td><td style="text-align:right" class="mono">${brl(r.resultado)}</td><td style="text-align:right" class="mono">${r.margem===null?'—':r.margem.toFixed(1)+'%'}</td></tr>`).join('')}</tbody>
      </table>`}
    </div>

    <div class="section-title">Ranking de eventos (por resultado)</div>
    <div class="card tight" style="margin-bottom:16px">
      ${eventoRank.length===0 ? emptyState('Nenhum evento cadastrado','') : `
      <table>
        <thead><tr><th>#</th><th>Evento</th><th style="text-align:right">Qtd.</th><th style="text-align:right">Entradas</th><th style="text-align:right">Saídas</th><th style="text-align:right">Resultado</th></tr></thead>
        <tbody>${eventoRank.map((r,i)=>`<tr><td>${i+1}º</td><td>${r.name}</td><td style="text-align:right" class="mono">${r.count}</td><td style="text-align:right" class="mono">${brl(r.entradas)}</td><td style="text-align:right" class="mono">${brl(r.saidas)}</td><td style="text-align:right" class="mono">${brl(r.resultado)}</td></tr>`).join('')}</tbody>
      </table>`}
    </div>

    <div class="section-title">Comparar duas ações</div>
    <div class="card tight">
      <div class="field-row" style="margin-bottom:14px">
        <div class="field" style="margin-bottom:0"><label>Ação A</label>
          <select id="compareA"><option value="">Selecione...</option>${DB.actions.map(a=>`<option value="${a.id}" ${compareAcaoA===a.id?'selected':''}>${a.name}</option>`).join('')}</select>
        </div>
        <div class="field" style="margin-bottom:0"><label>Ação B</label>
          <select id="compareB"><option value="">Selecione...</option>${DB.actions.map(a=>`<option value="${a.id}" ${compareAcaoB===a.id?'selected':''}>${a.name}</option>`).join('')}</select>
        </div>
      </div>
      ${(compareAcaoA && compareAcaoB) ? (()=>{
        const aA = actionById(compareAcaoA), aB = actionById(compareAcaoB);
        const sA = actionSummary(compareAcaoA), sB = actionSummary(compareAcaoB);
        const melhor = sA.resultado===sB.resultado ? null : (sA.resultado>sB.resultado ? aA.name : aB.name);
        return `
        <table>
          <thead><tr><th></th><th style="text-align:right">${aA.name}</th><th style="text-align:right">${aB.name}</th></tr></thead>
          <tbody>
            <tr><td>Entradas</td><td style="text-align:right" class="mono">${brl(sA.entradas)}</td><td style="text-align:right" class="mono">${brl(sB.entradas)}</td></tr>
            <tr><td>Saídas</td><td style="text-align:right" class="mono">${brl(sA.saidas)}</td><td style="text-align:right" class="mono">${brl(sB.saidas)}</td></tr>
            <tr><td>Resultado</td><td style="text-align:right" class="mono">${brl(sA.resultado)}</td><td style="text-align:right" class="mono">${brl(sB.resultado)}</td></tr>
            <tr><td>Margem</td><td style="text-align:right" class="mono">${sA.margem===null?'—':sA.margem.toFixed(1)+'%'}</td><td style="text-align:right" class="mono">${sB.margem===null?'—':sB.margem.toFixed(1)+'%'}</td></tr>
          </tbody>
        </table>
        <div class="sub" style="margin-top:10px">${melhor?`<b style="color:var(--cream)">${melhor}</b> teve o melhor resultado líquido.`:'Resultado empatado entre as duas ações.'}</div>`;
      })() : emptyState('Selecione duas ações para comparar','')}
    </div>
  `;
}

let auditoriaFilter = { entity:'todos', action:'todos', limit:100 };

function renderAuditoria(){
  const f = auditoriaFilter;
  let list = DB.auditLog;
  if(f.entity!=='todos') list = list.filter(l=>l.entity===f.entity);
  if(f.action!=='todos') list = list.filter(l=>l.action===f.action);
  const total = list.length;
  list = list.slice(0, f.limit);

  const entities = [...new Set(DB.auditLog.map(l=>l.entity))];
  const actions = [...new Set(DB.auditLog.map(l=>l.action))];

  return `
    <div class="page-header">
      <div><h1>Histórico e Auditoria</h1><div class="sub">Todo evento relevante fica registrado — nada é apagado silenciosamente.</div></div>
    </div>
    <div class="toolbar">
      <select id="audEntity">
        <option value="todos">Todos os registros</option>
        ${entities.map(e=>`<option value="${e}" ${f.entity===e?'selected':''}>${entityLabel(e)}</option>`).join('')}
      </select>
      <select id="audAction">
        <option value="todos">Todas as ações</option>
        ${actions.map(a=>`<option value="${a}" ${f.action===a?'selected':''}>${actionLabel(a)}</option>`).join('')}
      </select>
    </div>
    <div class="card tight">
      ${list.length===0 ? emptyState('Nenhum evento registrado ainda','') : `
      <table>
        <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Ação</th><th>Registro</th><th></th></tr></thead>
        <tbody>
          ${list.map(l=>`
            <tr>
              <td>${fmtDateTime(l.timestamp)}</td>
              <td>${l.user}</td>
              <td><span class="tag status">${actionLabel(l.action)}</span></td>
              <td>${entityLabel(l.entity)}</td>
              <td style="text-align:right"><button class="btn btn-ghost btn-sm" data-audit-detail="${l.id}">Detalhes</button></td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
    ${total>f.limit ? `<div style="text-align:center;margin-top:14px"><button class="btn btn-sm" id="btnCarregarMaisAud">Carregar mais (${total-f.limit} restantes)</button></div>` : ''}
  `;
}
function entityLabel(e){
  const map = { transacao:'Lançamento', conta:'Conta', categoria:'Categoria', acao:'Ação', evento:'Evento', mes:'Fechamento Mensal', sistema:'Sistema' };
  return map[e]||e;
}
function actionLabel(a){
  const map = { criacao:'Criação', alteracao:'Alteração', edicao:'Edição', cancelamento:'Cancelamento', fechamento:'Fechamento', reabertura:'Reabertura', recalculo:'Recálculo', backup:'Backup', importacao:'Importação' };
  return map[a]||a;
}

              <td><span class="tag status">${s.status==='ativo'?'Ativo':'Inativo'}</span></td>
              <td style="text-align:right;white-space:nowrap">
                <button class="btn btn-ghost btn-sm" data-edit-status="${s.id}">Editar nome</button>
                <button class="btn btn-ghost btn-sm" data-toggle-status="${s.id}">${s.status==='ativo'?'Desativar':'Reativar'}</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="sub" style="margin-top:10px">Desativar um status não altera ações/eventos já cadastrados com ele — apenas some da lista para novos cadastros.</div>
    </div>

    <div class="section-title">Tipos de Evento</div>
    <div class="card tight">
      <div class="toolbar" style="margin-bottom:10px">
        <input id="newEventTypeName" placeholder="Novo tipo (ex: Encontro de jovens)">
        <button class="btn btn-sm" id="btnAddEventType">+ Adicionar tipo</button>
      </div>
      <table>
        <thead><tr><th>Nome</th><th>Situação</th><th></th></tr></thead>
        <tbody>
          ${DB.eventTypes.map(t=>`
            <tr>
              <td>${t.name}</td>
              <td><span class="tag status">${t.status==='ativo'?'Ativo':'Inativo'}</span></td>
              <td style="text-align:right;white-space:nowrap">
                <button class="btn btn-ghost btn-sm" data-edit-eventtype="${t.id}">Editar nome</button>
                <button class="btn btn-ghost btn-sm" data-toggle-eventtype="${t.id}">${t.status==='ativo'?'Desativar':'Reativar'}</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="sub" style="margin-top:10px">Desativar um tipo não altera eventos já cadastrados com ele — apenas some da lista para novos cadastros.</div>
    </div>

    <div class="section-title">Ações / Eventos</div>
    <div class="card tight">
      <div class="sub" style="margin-bottom:10px">Gerencie em <b style="color:var(--cream)">Ações e Arrecadações</b> e <b style="color:var(--cream)">Eventos e Planejamento</b> no menu lateral. Desativar/encerrar uma ação ou evento não apaga o histórico: lançamentos antigos continuam vinculados normalmente.</div>
    </div>

    <div class="section-title">Contas</div>
    <div class="card tight">
      <div class="sub">Gerencie em <b style="color:var(--cream)">Contas e Caixas</b> no menu lateral.</div>
    </div>
  `;
}

/* -------------------------------- Handlers -------------------------------- */

const PAGE_RENDERERS = {
  dashboard: renderDashboard,
  lancamentos: renderLancamentos,
  calendario: renderCalendario,
  contas: renderContas,
  acoes: renderAcoes,
  eventos: renderEventos,
  fechamento: renderFechamento,
  prestacao: renderPrestacao,
  relatorios: renderRelatorios,
  auditoria: renderAuditoria,
  config: renderConfig,
};

function attachPageHandlers(page){
  document.querySelectorAll('[data-goto]').forEach(b=> b.addEventListener('click', ()=>{ currentPage=b.dataset.goto; renderAll(); }));

  if(page==='dashboard'){
    document.getElementById('btnNovoLancDash')?.addEventListener('click', ()=>openModalNovoLancamento());
  }

  if(page==='lancamentos'){
    document.getElementById('btnNovoLanc').addEventListener('click', ()=>openModalNovoLancamento());
    document.getElementById('fType').value = lancFilters.type;
    document.getElementById('fAccount').value = lancFilters.accountId;
    document.getElementById('fCategory').value = lancFilters.categoryId;
    document.getElementById('fType').addEventListener('change', e=>{ lancFilters.type=e.target.value; renderAll(); });
    document.getElementById('fAccount').addEventListener('change', e=>{ lancFilters.accountId=e.target.value; renderAll(); });
    document.getElementById('fCategory').addEventListener('change', e=>{ lancFilters.categoryId=e.target.value; renderAll(); });
    document.getElementById('fSearch').addEventListener('input', e=>{ lancFilters.search=e.target.value; renderAll(); });
    document.querySelectorAll('[data-edit-tx]').forEach(btn=>{
      btn.addEventListener('click', ()=> openModalNovoLancamento(DB.transactions.find(t=>t.id===btn.dataset.editTx)));
    });
    document.querySelectorAll('[data-cancel]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.cancel;
        const tx = DB.transactions.find(t=>t.id===id);
        if(isMonthClosed(tx.date)){ alert('Este mês está fechado. Reabra o mês para cancelar este lançamento.'); return; }
        if(!confirm('Cancelar este lançamento? Ele será preservado no histórico, mas deixará de contar nos totais.')) return;
        const before = {...tx};
        tx.status = 'cancelado';
        tx.updatedAt = nowISO();
        audit('cancelamento','transacao', tx.id, before, tx);
        saveDB();
        renderAll();
      });
    });
  }

  if(page==='contas'){
    document.getElementById('btnNovaConta').addEventListener('click', ()=>openModalNovaConta());
    document.querySelectorAll('[data-edit-account]').forEach(btn=>{
      btn.addEventListener('click', ()=> openModalNovaConta(accountById(btn.dataset.editAccount)));
    });
  }

  if(page==='acoes'){
    document.getElementById('btnNovaAcao').addEventListener('click', ()=>openModalNovaAcao());
    document.querySelectorAll('[data-edit-action]').forEach(btn=>{
      btn.addEventListener('click', ()=> openModalNovaAcao(actionById(btn.dataset.editAction)));
    });
  }

  if(page==='eventos'){
    document.getElementById('btnNovoEvento').addEventListener('click', ()=>openModalNovoEvento());
    document.querySelectorAll('[data-edit-event]').forEach(btn=>{
      btn.addEventListener('click', ()=> openModalNovoEvento(eventById(btn.dataset.editEvent)));
    });
  }

  if(page==='calendario' && calViewMode==='month'){
    document.getElementById('calPrev').addEventListener('click', ()=>{ calMonth = addMonths(calMonth,-1); renderAll(); });
    document.getElementById('calNext').addEventListener('click', ()=>{ calMonth = addMonths(calMonth,1); renderAll(); });
    document.getElementById('calYearJump').addEventListener('change', e=>{ calMonth = e.target.value + '-' + calMonth.slice(5,7); renderAll(); });
    document.getElementById('calViewYear').addEventListener('click', ()=>{ calViewMode='year'; renderAll(); });
    document.querySelectorAll('.cal-cell[data-day]').forEach(cell=>{
      cell.addEventListener('click', ()=> openDayDetail(cell.dataset.day));
    });
  }
  if(page==='calendario' && calViewMode==='year'){
    document.getElementById('calAnoPrev').addEventListener('click', ()=>{ calMonth = String(Number(calMonth.slice(0,4))-1) + calMonth.slice(4); renderAll(); });
    document.getElementById('calAnoNext').addEventListener('click', ()=>{ calMonth = String(Number(calMonth.slice(0,4))+1) + calMonth.slice(4); renderAll(); });
    document.getElementById('calAnoJump').addEventListener('change', e=>{ calMonth = e.target.value + calMonth.slice(4); renderAll(); });
    document.getElementById('calViewMonth').addEventListener('click', ()=>{ calViewMode='month'; renderAll(); });
    document.querySelectorAll('.cal-mes-card[data-mes-jump]').forEach(card=>{
      card.addEventListener('click', ()=>{ calMonth = card.dataset.mesJump; calViewMode='month'; renderAll(); });
    });
  }

  if(page==='fechamento'){
    const months = monthsWithData();
    const openMonth = months.find(mk => !closureFor(mk)) || months[months.length-1];
    document.getElementById('btnConferir')?.addEventListener('click', ()=>{
      const data = monthClosureData(openMonth);
      const informado = Number(document.getElementById('saldoConferido').value);
      if(isNaN(informado) || document.getElementById('saldoConferido').value===''){ alert('Informe o saldo conferido.'); return; }
      const diff = Math.round((informado - data.saldoCalculado) * 100) / 100;
      const box = document.getElementById('conciliacaoResult');
      if(Math.abs(diff) < 0.005){
        box.innerHTML = `<div class="alert-banner ok" style="margin-top:12px"><span>🟢</span><span class="grow"><b>Conferido.</b> O saldo informado bate com o saldo calculado do sistema.</span></div>`;
      } else {
        box.innerHTML = `<div class="alert-banner warn" style="margin-top:12px"><span>🟡</span><span class="grow"><b>Diferença de ${brl(Math.abs(diff))}</b> ${diff>0?'a mais':'a menos'} do que o calculado pelo sistema. Você pode registrar uma observação sobre a diferença ao fechar o mês.</span></div>`;
      }
    });
    document.getElementById('btnFecharMes')?.addEventListener('click', ()=>{
      const data = monthClosureData(openMonth);
      const informadoStr = document.getElementById('saldoConferido').value;
      const informado = informadoStr==='' ? data.saldoCalculado : Number(informadoStr);
      if(!confirm(`Fechar o mês de ${new Date(openMonth+'-02').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}? Não será possível alterar lançamentos deste mês sem reabri-lo.`)) return;
      const closure = {
        id: uid('close'), yearMonth: openMonth,
        saldoAnterior: data.saldoAnterior, entradas: data.entradas, saidas: data.saidas,
        saldoCalculado: data.saldoCalculado, saldoConferido: informado,
        diferenca: Math.round((informado-data.saldoCalculado)*100)/100,
        status:'fechado', closedAt: nowISO(), closedBy:'Tesoureiro', note:'',
      };
      DB.closures.push(closure);
      audit('fechamento','mes', openMonth, null, closure);
      recalcularMesesPosteriores(openMonth);
      saveDB();
      openModal(`
        <div class="modal-header"><h2>Fechamento realizado com sucesso</h2></div>
        <div class="sub" style="margin-bottom:16px">Recomendamos realizar um backup dos dados agora.</div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button type="button" class="btn btn-ghost" id="mContinuar">Continuar sem backup</button>
          <button type="button" class="btn btn-primary" id="mBackupAgora">Fazer Backup Agora</button>
        </div>
      `);
      document.getElementById('mContinuar').addEventListener('click', ()=>{ closeModal(); renderAll(); });
      document.getElementById('mBackupAgora').addEventListener('click', ()=>{ closeModal(); exportBackup(); });
    });
    function reabrirMes(mk){
      const closure = closureFor(mk);
      if(!closure) return;
      if(!confirm(`Reabrir ${new Date(mk+'-02').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}? Isso permitirá editar lançamentos deste mês novamente.`)) return;
      const motivo = prompt('Informe o motivo da reabertura deste mês:');
      if(motivo===null || motivo.trim()===''){ alert('É necessário informar um motivo para reabrir o mês.'); return; }
      const before = {...closure};
      DB.closures = DB.closures.filter(c=>c.id!==closure.id);
      audit('reabertura','mes', mk, before, { motivo, reabertoEm: nowISO() });
      saveDB();
      renderAll();
    }
    document.getElementById('btnReabrirMes')?.addEventListener('click', ()=> reabrirMes(openMonth));
    document.querySelectorAll('[data-reabrir-hist]').forEach(btn=>{
      btn.addEventListener('click', ()=> reabrirMes(btn.dataset.reabrirHist));
    });
  }

  if(page==='prestacao'){
    document.getElementById('btnExportarPdf').addEventListener('click', ()=> window.print());
    document.getElementById('pTipo').addEventListener('change', e=>{ prestacaoFilter.type = e.target.value; renderAll(); });
    document.getElementById('pMonth')?.addEventListener('change', e=>{ prestacaoFilter.month = e.target.value; renderAll(); });
    document.getElementById('pYear')?.addEventListener('change', e=>{ prestacaoFilter.year = Number(e.target.value); renderAll(); });
    document.getElementById('pStart')?.addEventListener('change', e=>{ prestacaoFilter.startDate = e.target.value; renderAll(); });
    document.getElementById('pEnd')?.addEventListener('change', e=>{ prestacaoFilter.endDate = e.target.value; renderAll(); });
    document.getElementById('pCategory')?.addEventListener('change', e=>{ prestacaoFilter.categoryId = e.target.value; renderAll(); });
    document.getElementById('pAction')?.addEventListener('change', e=>{ prestacaoFilter.actionId = e.target.value; renderAll(); });
    document.getElementById('pEvent')?.addEventListener('change', e=>{ prestacaoFilter.eventId = e.target.value; renderAll(); });
  }

  if(page==='relatorios'){
    document.getElementById('rankAcaoOrdem').addEventListener('change', e=>{ rankingAcaoOrdem = e.target.value; renderAll(); });
    document.getElementById('rankAno').addEventListener('change', e=>{ rankingAno = e.target.value; renderAll(); });
    document.getElementById('compareA').addEventListener('change', e=>{ compareAcaoA = e.target.value; renderAll(); });
    document.getElementById('compareB').addEventListener('change', e=>{ compareAcaoB = e.target.value; renderAll(); });
    document.querySelectorAll('[data-year-chip]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const y = Number(chip.dataset.yearChip);
        comparAnos = comparAnos.includes(y) ? comparAnos.filter(x=>x!==y) : [...comparAnos, y];
        renderAll();
      });
    });
  }

  if(page==='auditoria'){
    document.getElementById('audEntity').addEventListener('change', e=>{ auditoriaFilter.entity = e.target.value; auditoriaFilter.limit=100; renderAll(); });
    document.getElementById('audAction').addEventListener('change', e=>{ auditoriaFilter.action = e.target.value; auditoriaFilter.limit=100; renderAll(); });
    document.getElementById('btnCarregarMaisAud')?.addEventListener('click', ()=>{ auditoriaFilter.limit += 100; renderAll(); });
    document.querySelectorAll('[data-audit-detail]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const log = DB.auditLog.find(l=>l.id===btn.dataset.auditDetail);
        openModal(`
          <div class="modal-header"><h2>Detalhes do evento</h2><button class="close-x" id="mClose">✕</button></div>
          <div class="sub" style="margin-bottom:10px">${fmtDateTime(log.timestamp)} · ${log.user} · ${actionLabel(log.action)} · ${entityLabel(log.entity)}</div>
          ${log.changes && log.changes.length ? `
          <table style="margin-bottom:10px">
            <thead><tr><th>Campo</th><th>De</th><th>Para</th></tr></thead>
            <tbody>${log.changes.map(c=>`<tr><td>${c.campo}</td><td class="mono">${escapeHtml(String(c.de))}</td><td class="mono">${escapeHtml(String(c.para))}</td></tr>`).join('')}</tbody>
          </table>` : `
          <div class="field-row">
            <div class="field"><label>Antes</label><pre class="mono" style="background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;max-height:260px;overflow:auto">${log.before? escapeHtml(JSON.stringify(log.before,null,2)) : '—'}</pre></div>
            <div class="field"><label>Depois</label><pre class="mono" style="background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;max-height:260px;overflow:auto">${log.after? escapeHtml(JSON.stringify(log.after,null,2)) : '—'}</pre></div>
          </div>`}
          <div style="display:flex;justify-content:flex-end;margin-top:10px"><button type="button" class="btn btn-ghost" id="mCancel">Fechar</button></div>
        `);
        document.getElementById('mClose').addEventListener('click', closeModal);
        document.getElementById('mCancel').addEventListener('click', closeModal);
      });
    });
  }

  if(page==='config'){
    document.getElementById('btnExportar').addEventListener('click', exportBackup);
    document.getElementById('btnImportarTrigger').addEventListener('click', ()=> document.getElementById('fileImportar').click());
    document.getElementById('fileImportar').addEventListener('change', handleImportFile);
    document.getElementById('btnAddCategory').addEventListener('click', ()=>{
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();
      if(!name) return;
      const type = document.getElementById('newCategoryType').value;
      const description = document.getElementById('newCategoryDescription').value.trim();
      const cat = { id: uid('cat'), name, status:'ativa', type, description, createdAt: nowISO() };
      DB.categories.push(cat);
      audit('criacao','categoria', cat.id, null, cat);
      saveDB(); renderAll();
    });
    document.querySelectorAll('[data-edit-category]').forEach(btn=>{
      btn.addEventListener('click', ()=> openModalEditarCategoria(categoryById(btn.dataset.editCategory)));
    });
    document.querySelectorAll('[data-toggle-category]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cat = categoryById(btn.dataset.toggleCategory);
        const before = {...cat};
        cat.status = cat.status==='ativa' ? 'inativa' : 'ativa';
        audit('alteracao','categoria', cat.id, before, cat);
        saveDB(); renderAll();
      });
    });
    document.getElementById('backupAlertDays').addEventListener('change', e=>{
      DB.settings.backupAlertDays = Number(e.target.value)||7;
      saveDB(); renderAll();
    });

    document.getElementById('btnAddStatus').addEventListener('click', ()=>{
      const input = document.getElementById('newStatusName');
      const name = input.value.trim();
      if(!name) return;
      const st = { id: uid('stt'), name, status:'ativo', builtin:false, createdAt: nowISO() };
      DB.actionEventStatuses.push(st);
      audit('criacao','status_acao_evento', st.id, null, st);
      saveDB(); renderAll();
    });
    document.querySelectorAll('[data-edit-status]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const st = DB.actionEventStatuses.find(x=>x.id===btn.dataset.editStatus);
        const novoNome = prompt('Novo nome para este status:', st.name);
        if(novoNome===null || !novoNome.trim()) return;
        const before = {...st};
        st.name = novoNome.trim();
        audit('alteracao','status_acao_evento', st.id, before, st);
        saveDB(); renderAll();
      });
    });
    document.querySelectorAll('[data-toggle-status]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const st = DB.actionEventStatuses.find(x=>x.id===btn.dataset.toggleStatus);
        const before = {...st};
        st.status = st.status==='ativo' ? 'inativo' : 'ativo';
        audit(st.status==='ativo'?'ativacao':'desativacao','status_acao_evento', st.id, before, st);
        saveDB(); renderAll();
      });
    });

    document.getElementById('btnAddEventType').addEventListener('click', ()=>{
      const input = document.getElementById('newEventTypeName');
      const name = input.value.trim();
      if(!name) return;
      const et = { id: uid('evtype'), name, status:'ativo', builtin:false, createdAt: nowISO() };
      DB.eventTypes.push(et);
      audit('criacao','tipo_evento', et.id, null, et);
      saveDB(); renderAll();
    });
    document.querySelectorAll('[data-edit-eventtype]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const et = DB.eventTypes.find(x=>x.id===btn.dataset.editEventtype);
        const novoNome = prompt('Novo nome para este tipo de evento:', et.name);
        if(novoNome===null || !novoNome.trim()) return;
        const before = {...et};
        et.name = novoNome.trim();
        audit('alteracao','tipo_evento', et.id, before, et);
        saveDB(); renderAll();
      });
    });
    document.querySelectorAll('[data-toggle-eventtype]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const et = DB.eventTypes.find(x=>x.id===btn.dataset.toggleEventtype);
        const before = {...et};
        et.status = et.status==='ativo' ? 'inativo' : 'ativo';
        audit(et.status==='ativo'?'ativacao':'desativacao','tipo_evento', et.id, before, et);
        saveDB(); renderAll();
      });
    });
  }
}

/* --------------------------------- Modais ---------------------------------- */

function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}
document.addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});

function openModalNovoLancamento(existing, presets){
  presets = presets || {};
  const activeAccounts = DB.accounts.filter(a=>a.status==='ativa' || a.id===existing?.accountId || a.id===existing?.transferToAccountId);
  const activeCategories = DB.categories.filter(c=>c.status==='ativa' || c.id===existing?.categoryId);
  const locked = existing && isMonthClosed(existing.date);
  if(locked){
    alert('Este mês está fechado. Para editar este lançamento, reabra o mês em "Fechamento Mensal".');
    return;
  }
  openModal(`
    <div class="modal-header"><h2>${existing?'Editar Lançamento':'Novo Lançamento'}</h2><button class="close-x" id="mClose">✕</button></div>
    <form id="formLancamento">
      <div class="field-row">
        <div class="field"><label>Data</label><input type="date" name="date" value="${existing?.date||todayInputValue()}" required></div>
        <div class="field"><label>Tipo</label>
          <select name="type" id="txType" required>
            <option value="entrada" ${existing?.type==='entrada'?'selected':''}>Entrada</option>
            <option value="saida" ${existing?.type==='saida'?'selected':''}>Saída</option>
            <option value="saldo_inicial" ${existing?.type==='saldo_inicial'?'selected':''}>Saldo Inicial</option>
            <option value="transferencia" ${existing?.type==='transferencia'?'selected':''}>Transferência</option>
          </select>
        </div>
      </div>
      <div class="field-row" id="rowCategoryAction">
        <div class="field"><label>Categoria</label>
          <select name="categoryId" id="txCategory">
            <option value="">Selecione...</option>
            ${activeCategories.map(c=>`<option value="${c.id}" ${existing?.categoryId===c.id?'selected':''}>${c.name}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Ação (opcional)</label>
          <select name="actionId" id="txAction"><option value="">Nenhuma</option></select>
        </div>
      </div>
      <div class="field-row" id="rowEvent">
        <div class="field"><label>Evento (opcional)</label>
          <select name="eventId" id="txEvent">
            <option value="">Nenhum</option>
            ${DB.events.map(ev=>`<option value="${ev.id}" ${existing?.eventId===ev.id?'selected':''}>${ev.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field" id="fieldAccountLabelWrap"><label id="labelAccount">Conta/Caixa</label>
          <select name="accountId" id="txAccount" required>${activeAccounts.map(a=>`<option value="${a.id}" ${existing?.accountId===a.id?'selected':''}>${a.name}</option>`).join('')}</select>
        </div>
        <div class="field" id="fieldTransferTo" style="display:none"><label>Conta destino</label>
          <select name="transferToAccountId">${activeAccounts.map(a=>`<option value="${a.id}" ${existing?.transferToAccountId===a.id?'selected':''}>${a.name}</option>`).join('')}</select>
        </div>
        <div class="field" id="fieldPayment"><label>Forma de pagamento</label>
          <select name="paymentMethod">
            <option value="" ${!existing?.paymentMethod?'selected':''}>—</option>
            ${['Dinheiro','PIX','Cartão','Transferência','Outro'].map(p=>`<option ${existing?.paymentMethod===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0.01" name="value" value="${existing?.value||''}" required></div>
        <div class="field"><label>Responsável</label><input type="text" name="responsible" placeholder="Nome" value="${existing?.responsible||''}"></div>
      </div>
      <div class="field"><label>Descrição</label><input type="text" name="description" placeholder="Ex: Venda de Feijoada" value="${existing?.description||''}"></div>
      <div class="field"><label>Observação</label><textarea name="note" rows="2">${existing?.note||''}</textarea></div>
      <div class="field">
        <label>Comprovante (opcional)</label>
        ${existing?.attachment ? `
          <div class="list-row" style="padding:6px 0">
            <a href="${existing.attachment.dataUrl}" target="_blank" style="color:var(--orange-bright);font-size:13px">📎 ${escapeHtml(existing.attachment.name)}</a>
            <label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;font-size:12.5px;color:var(--cream-dim)"><input type="checkbox" name="removeAttachment"> remover</label>
          </div>` : ''}
        <input type="file" name="attachmentFile" accept="image/png,image/jpeg,image/webp,application/pdf">
        <div style="font-size:11px;color:var(--cream-dim);margin-top:4px">Imagem ou PDF, até 1,5MB.</div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
        <button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">${existing?'Salvar Alterações':'Salvar Lançamento'}</button>
      </div>
    </form>
  `);
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);

  function refreshCategoryOptionsForType(){
    const t = document.getElementById('txType').value;
    const sel = document.getElementById('txCategory');
    const current = sel.value || existing?.categoryId || '';
    const opts = activeCategories.filter(c=>{
      const ct = categoryType(c);
      if(ct==='ambos') return true;
      if(t==='entrada') return ct==='entrada';
      if(t==='saida') return ct==='saida';
      return true; // saldo_inicial/transferencia não usam categoria (linha fica oculta)
    });
    sel.innerHTML = '<option value="">Selecione...</option>' + opts.map(c=>`<option value="${c.id}" ${current===c.id?'selected':''}>${c.name}</option>`).join('');
  }

  function refreshActionsForCategory(){
    const catId = document.getElementById('txCategory').value;
    const sel = document.getElementById('txAction');
    const opts = DB.actions.filter(a=> !catId || a.categoryId===catId);
    sel.innerHTML = '<option value="">Nenhuma</option>' + opts.map(a=>`<option value="${a.id}" ${existing?.actionId===a.id?'selected':''}>${a.name}</option>`).join('');
  }
  function refreshEventsForCategory(){
    const catId = document.getElementById('txCategory').value;
    const sel = document.getElementById('txEvent');
    const opts = DB.events.filter(ev=> !catId || !ev.categoryId || ev.categoryId===catId);
    sel.innerHTML = '<option value="">Nenhum</option>' + opts.map(ev=>`<option value="${ev.id}" ${existing?.eventId===ev.id?'selected':''}>${ev.name}</option>`).join('');
  }
  refreshActionsForCategory();
  refreshEventsForCategory();
  document.getElementById('txCategory').addEventListener('change', ()=>{ refreshActionsForCategory(); refreshEventsForCategory(); });

  function updateFieldsForType(){
    const t = document.getElementById('txType').value;
    document.getElementById('rowCategoryAction').style.display = (t==='saldo_inicial'||t==='transferencia') ? 'none' : 'grid';
    document.getElementById('rowEvent').style.display = (t==='saldo_inicial'||t==='transferencia') ? 'none' : 'grid';
    document.getElementById('fieldTransferTo').style.display = (t==='transferencia') ? 'block' : 'none';
    document.getElementById('fieldPayment').style.display = (t==='transferencia') ? 'none' : 'block';
    document.getElementById('labelAccount').textContent = t==='transferencia' ? 'Conta origem' : 'Conta/Caixa';
    refreshCategoryOptionsForType();
    refreshActionsForCategory();
    refreshEventsForCategory();
  }
  updateFieldsForType();
  document.getElementById('txType').addEventListener('change', updateFieldsForType);

  if(presets.type){ document.getElementById('txType').value = presets.type; updateFieldsForType(); }
  if(presets.accountId){ document.getElementById('txAccount').value = presets.accountId; }

  document.getElementById('formLancamento').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const type = fd.get('type');
    const date = fd.get('date');
    const value = Number(fd.get('value'));
    if(!value || value<=0){ alert('Informe um valor maior que zero.'); return; }
    if(type!=='saldo_inicial' && type!=='transferencia' && !fd.get('categoryId')){ alert('Categoria é obrigatória para entradas e saídas.'); return; }
    if(type==='transferencia' && fd.get('accountId')===fd.get('transferToAccountId')){ alert('A conta de origem e destino devem ser diferentes.'); return; }
    if(isMonthClosed(date)){ alert('Este mês está fechado. Reabra o mês em "Fechamento Mensal" para lançar ou alterar movimentações nele.'); return; }
    if(existing && isMonthClosed(existing.date)){ alert('Este mês está fechado. Reabra o mês para editar este lançamento.'); return; }

    // saldo inicial único por conta
    if(type==='saldo_inicial'){
      const outroSaldoInicial = activeTx().find(t=> t.type==='saldo_inicial' && t.accountId===fd.get('accountId') && t.id!==existing?.id);
      if(outroSaldoInicial){
        const editarExistente = confirm('Já existe um saldo inicial para esta conta. Deseja editar o saldo inicial existente em vez de criar outro?');
        closeModal();
        if(editarExistente) openModalNovoLancamento(outroSaldoInicial);
        return;
      }
    }

    // comprovante
    let attachment = existing?.attachment || null;
    if(fd.get('removeAttachment')) attachment = null;
    const file = fd.get('attachmentFile');
    if(file && file.size>0){
      const tiposAceitos = ['image/png','image/jpeg','image/jpg','image/webp','application/pdf'];
      if(file.size > 1.5*1024*1024){ alert('Arquivo muito grande (máx. 1,5MB). Escolha um arquivo menor.'); return; }
      if(!tiposAceitos.includes(file.type)){ alert('Formato não suportado. Envie uma imagem (PNG/JPG/WEBP) ou PDF.'); return; }
      try{
        attachment = await new Promise((res,rej)=>{
          const r = new FileReader();
          r.onload = ()=> res({ name:file.name, type:file.type, size:file.size, dataUrl:r.result });
          r.onerror = ()=> rej(new Error('Falha ao ler o arquivo'));
          r.readAsDataURL(file);
        });
      }catch(err){ alert('Não foi possível anexar o comprovante.'); return; }
    }

    const dadosNovos = {
      date, type,
      categoryId: fd.get('categoryId') || null,
      actionId: fd.get('actionId') || null,
      eventId: fd.get('eventId') || null,
      accountId: fd.get('accountId'),
      transferToAccountId: type==='transferencia' ? fd.get('transferToAccountId') : null,
      paymentMethod: type==='transferencia' ? 'Transferência interna' : fd.get('paymentMethod'),
      value,
      responsible: fd.get('responsible')||'',
      description: fd.get('description')||'',
      note: fd.get('note')||'',
    };

    if(existing){
      const before = {...existing};
      Object.assign(existing, dadosNovos, { attachment, updatedAt: nowISO() });
      const changes = diffCamposLancamento(before, existing);
      audit('edicao','transacao', existing.id, before, existing, changes);
    } else {
      const tx = { id: uid('tx'), ...dadosNovos, attachment, createdAt: nowISO(), updatedAt: nowISO(), status:'ativo' };
      DB.transactions.push(tx);
      audit('criacao','transacao', tx.id, null, tx);
    }
    saveDB();
    closeModal();
    renderAll();
  });
}

/* ------------------------------ Backup: export/import ---------------------- */

function exportBackup(){
  const payload = JSON.parse(JSON.stringify(DB));
  payload.meta.exportedAt = nowISO();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayInputValue();
  a.href = url; a.download = `backup_tesouraria_betel_${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  DB.meta.lastBackupAt = nowISO();
  audit('backup','sistema', null, null, { at: DB.meta.lastBackupAt });
  saveDB({ touchData:false });
  renderAll();
}

function validarBackup(parsed){
  const erros = [];
  if(typeof parsed !== 'object' || parsed===null){
    erros.push('O arquivo não contém um objeto JSON válido.');
    return erros;
  }
  ['transactions','accounts','categories','actions','events','closures','auditLog'].forEach(key=>{
    if(!Array.isArray(parsed[key])) erros.push(`Campo "${key}" ausente ou não é uma lista.`);
  });
  if(!parsed.meta || typeof parsed.meta!=='object') erros.push('Metadados ("meta") ausentes ou inválidos.');
  if(Array.isArray(parsed.transactions)){
    const ids = new Set();
    const tiposValidos = ['entrada','saida','saldo_inicial','transferencia'];
    parsed.transactions.forEach((t,i)=>{
      if(!t || typeof t!=='object'){ erros.push(`Lançamento #${i+1} está corrompido.`); return; }
      if(!t.id) erros.push(`Lançamento #${i+1} sem ID.`);
      else if(ids.has(t.id)) erros.push(`ID duplicado encontrado na base: ${t.id}.`);
      ids.add(t.id);
      if(!t.date || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) erros.push(`Lançamento #${i+1} com data inválida.`);
      if(!tiposValidos.includes(t.type)) erros.push(`Lançamento #${i+1} com tipo inválido: "${t.type}".`);
      if(typeof t.value !== 'number' || t.value<=0) erros.push(`Lançamento #${i+1} com valor inválido.`);
    });
  }
  return erros;
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(err){ alert('Arquivo inválido — não foi possível ler o backup (JSON malformado).'); e.target.value=''; return; }

    const erros = validarBackup(parsed);
    if(erros.length>0){
      alert(`Este arquivo não pôde ser importado. Nenhuma alteração foi feita nos dados atuais.\n\nProblemas encontrados:\n\n${erros.slice(0,15).map(x=>'• '+x).join('\n')}${erros.length>15?`\n... e mais ${erros.length-15} problema(s).`:''}`);
      e.target.value='';
      return;
    }

    const anexos = parsed.transactions.filter(t=>t.attachment).length;
    const periodo = parsed.transactions.length
      ? `${fmtDate(parsed.transactions.map(t=>t.date).sort()[0])} a ${fmtDate(parsed.transactions.map(t=>t.date).sort().slice(-1)[0])}`
      : '—';
    const resumo = `Arquivo: ${file.name}
Versão do backup: ${parsed.meta?.version || 'desconhecida'}
Lançamentos: ${parsed.transactions.length} (${anexos} com comprovante)
Categorias: ${(parsed.categories||[]).length}
Ações: ${(parsed.actions||[]).length}
Eventos: ${(parsed.events||[]).length}
Contas: ${(parsed.accounts||[]).length}
Fechamentos: ${(parsed.closures||[]).length}
Período: ${periodo}

Isso vai SUBSTITUIR os dados atuais deste dispositivo por este backup.
Um backup de segurança dos dados atuais será baixado antes de continuar.

Deseja restaurar?`;
    if(!confirm(resumo)){ e.target.value=''; return; }
    // cópia de segurança dos dados atuais antes de restaurar
    exportBackup();
    DB = Object.assign(defaultDB(), parsed);
    DB.meta.lastDataChangeAt = nowISO();
    audit('importacao','sistema', null, null, { arquivo:file.name, lancamentos:parsed.transactions.length, restauradoEm: nowISO() });
    saveDB({ touchData:false });
    alert('Backup restaurado com sucesso.');
    e.target.value='';
    renderAll();
  };
  reader.readAsText(file);
}

/* --------------------------------- Boot ------------------------------------ */
renderAll();

</script>
